# Self-host NATS config.
# The EVENTS stream's own retention is created by capture on boot (CAPTURE_STREAM_MAX_AGE_SECS /
# CAPTURE_STREAM_MAX_BYTES); keep CAPTURE_STREAM_MAX_BYTES below max_file_store so the stream cap
# trips first (clean 503 backpressure) instead of the server-wide store filling up.
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data"
  max_file_store: 20GB
  max_memory_store: 256MB
}

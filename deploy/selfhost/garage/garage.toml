# Garage (bundled S3 for support attachments, compose profile `storage`). Single node, no
# replication. Secrets are NOT in this file: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN come from
# the environment (.env, generated by install.sh).
#
# s3_region must equal AWS_REGION in .env (default us-east-1): capture signs URLs with that
# region and Garage rejects a mismatching credential scope. Change both together.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "0.0.0.0:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"

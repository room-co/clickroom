# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run: cargo deny check licenses advisories bans sources
# The workspace is AGPL-3.0-only, so every dependency must be AGPL-compatible
# (permissive or weak-copyleft). Add an SPDX id below only after reviewing it.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle data); permissive
  "BSL-1.0",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]

[advisories]
unmaintained = "workspace"
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Self-host (docker compose), Clickroom Cloud, Local development]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: CLICKROOM_VERSION from your .env, or the commit SHA.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail=200 <service>`. Redact secrets and personal data."
      render: shell

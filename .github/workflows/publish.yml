name: Publish SDKs

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

# npm Trusted Publishing (OIDC): no stored npm token. `id-token: write` lets npm exchange this
# run's OIDC identity for a short-lived publish credential, and also signs the provenance
# statement. Requires room-co/clickroom + `publish.yml` registered as a trusted publisher on
# npmjs.com for each package (no environment).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & publish @clickroom SDKs
    runs-on: ubuntu-latest
    # Forks must never publish under our npm scope. Only the public room-co/clickroom repo publishes.
    if: github.repository == 'room-co/clickroom'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No registry-url: that makes setup-node write an .npmrc with a NODE_AUTH_TOKEN
          # placeholder, which can shadow the OIDC exchange. npm defaults to registry.npmjs.org.
      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14).
      - run: npm install -g npm@^11.5.1
      - run: npm --version
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @clickroom/sdk-js build
      - run: pnpm --filter @clickroom/sdk-js test
      - name: Publish @clickroom/sdk-js
        run: |
          version=$(node -p "require('./packages/sdk-js/package.json').version")
          if npm view "@clickroom/sdk-js@$version" version >/dev/null 2>&1; then
            echo "@clickroom/sdk-js@$version already published, skipping"
          else
            # pnpm pack rewrites workspace:* to the real version; npm publishes the tarball via OIDC.
            dest=$(mktemp -d)
            (cd packages/sdk-js && pnpm pack --pack-destination "$dest")
            npm publish "$dest"/*.tgz --access public --provenance
          fi

      # sdk-node depends on sdk-js via workspace:*, which pnpm rewrites to the exact
      # version above — so it can only be published after sdk-js is on the registry.
      - run: pnpm --filter @clickroom/sdk-node build
      - run: pnpm --filter @clickroom/sdk-node test
      - name: Publish @clickroom/sdk-node
        run: |
          version=$(node -p "require('./packages/sdk-node/package.json').version")
          if npm view "@clickroom/sdk-node@$version" version >/dev/null 2>&1; then
            echo "@clickroom/sdk-node@$version already published, skipping"
          else
            # pnpm pack rewrites workspace:* to the real version; npm publishes the tarball via OIDC.
            dest=$(mktemp -d)
            (cd packages/sdk-node && pnpm pack --pack-destination "$dest")
            npm publish "$dest"/*.tgz --access public --provenance
          fi

      # sdk-react-native depends on sdk-js via workspace:*, which pnpm rewrites to the exact
      # version above — so it can only be published after sdk-js is on the registry.
      - run: pnpm --filter @clickroom/sdk-react-native build
      - run: pnpm --filter @clickroom/sdk-react-native test
      - name: Publish @clickroom/sdk-react-native
        run: |
          version=$(node -p "require('./packages/sdk-react-native/package.json').version")
          if npm view "@clickroom/sdk-react-native@$version" version >/dev/null 2>&1; then
            echo "@clickroom/sdk-react-native@$version already published, skipping"
          else
            # pnpm pack rewrites workspace:* to the real version; npm publishes the tarball via OIDC.
            dest=$(mktemp -d)
            (cd packages/sdk-react-native && pnpm pack --pack-destination "$dest")
            npm publish "$dest"/*.tgz --access public --provenance
          fi

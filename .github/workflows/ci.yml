name: CI

# PRs only — no `push: branches: [main]`. Actions minutes are budgeted, and a push-to-main
# run is redundant with the PR run that preceded it. NOTE: commits pushed directly to main
# (bypassing a PR) get NO CI. `lefthook.yml` pre-commit covers biome + `pnpm -r typecheck` +
# cargo fmt/clippy locally, but NOT `pnpm test`, `cargo test`, or `turbo run build` — run
# `make test` before a direct-to-main push, or open a PR.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS (build / typecheck / lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck
      - run: pnpm biome check .

  rust:
    name: Rust (build / test / clippy)
    runs-on: ubuntu-latest
    # capture's `quota::tests::*` and `schema::tests::*` are integration tests against a real
    # Redis (they exercise the quota Lua script and the schema-cache fetch). They read REDIS_URL
    # and fall back to `redis://127.0.0.1:6380` — port 6380, matching docker-compose, NOT the
    # default 6379. Without this service they fail with "Connection refused (os error 111)",
    # which is what made every CI run red while everything passed locally under `make infra:up`.
    #
    # Likewise `support::store::db_tests::*` need Postgres (Prisma schema migrated), Redis and a
    # NATS connection (AppState bundles all three). Ports mirror docker-compose.yml (pg 5433,
    # redis 6380, nats 4222) because ingest's tests hardcode them.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clickroom
          POSTGRES_PASSWORD: clickroom
          POSTGRES_DB: clickroom
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clickroom -d clickroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clickroom:clickroom@localhost:5433/clickroom?schema=public
      REDIS_URL: redis://localhost:6380
      NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v5
      # Service containers cannot take a command, and NATS needs `-js` (JetStream).
      - name: Start NATS (JetStream)
        run: |
          docker run -d --name nats -p 4222:4222 nats:latest -js
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null && exit 0; sleep 1; done
          docker logs nats; exit 1
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate Postgres (Prisma)
        run: |
          pnpm --filter @clickroom/db prisma:generate
          pnpm --filter @clickroom/db exec prisma migrate deploy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --all -- --check

  # ── Open-source hygiene ────────────────────────────────
  # None of these use repository secrets, so they run unchanged on PRs from forks.
  licenses:
    name: Licences (cargo deny / pnpm licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # AGPL-3.0 server + MIT SDKs: fail on dependencies with licences we cannot redistribute.
      # Keep the DENY pattern below and deny.toml (Rust) in sync.
      - name: pnpm licences (prod deps)
        run: |
          pnpm licenses list --prod --json > licenses.json
          node -e '
            const l = require("./licenses.json");
            const DENY = /(^|[ (])(GPL-[123]|LGPL|SSPL|BUSL|Commons-Clause|UNLICENSED|Proprietary)/i;
            const bad = Object.entries(l).filter(([k]) => DENY.test(k) && !/^AGPL/i.test(k));
            for (const [k, pkgs] of bad) console.error(k, pkgs.map((p) => p.name).join(", "));
            if (bad.length) process.exit(1);
          '
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        # Official CLI via container — the gitleaks-action needs a licence key for orgs.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose

  # Builds every image from source, brings up deploy/selfhost, and proves the stack works
  # end to end. Runs on fork PRs (no secrets, no registry push).
  selfhost-smoke:
    name: Self-host compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [ts, rust]
    env:
      CLICKROOM_VERSION: ci
      CLICKROOM_REGISTRY: ghcr.io/ci-local
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          build() { # name dockerfile
            docker buildx build --load -t "$CLICKROOM_REGISTRY/clickroom-$1:$CLICKROOM_VERSION" -f "$2" .
          }
          build api     apps/api/Dockerfile
          build capture services/capture/Dockerfile
          build ingest  services/ingest/Dockerfile
          build query   services/query/Dockerfile
          build web     apps/web/Dockerfile
          build admin   apps/admin/Dockerfile
          build migrate infra/docker/Dockerfile.migrate
      - name: Generate .env and start the stack
        working-directory: deploy/selfhost
        run: |
          # install.sh is the real entry point; --no-pull keeps our locally built images.
          # Seed .env with the bundled Garage S3 profile so the smoke test covers attachments too.
          cp .env.example .env
          printf '%s\n' COMPOSE_PROFILES=storage S3_BUCKET=clickroom-attachments \
            SUPPORT_ATTACHMENTS_BUCKET=clickroom-attachments S3_ENDPOINT=http://garage:3900 \
            S3_PUBLIC_ENDPOINT=http://localhost >> .env
          CLICKROOM_DOMAIN=http://localhost ./install.sh --non-interactive --no-pull
      - name: Wait for health
        working-directory: deploy/selfhost
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/health >/dev/null && curl -fsS http://localhost/capture/health >/dev/null; then
              echo healthy; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs --tail=100
          exit 1
      - name: Event round trip (capture -> NATS -> ingest -> ClickHouse)
        env:
          SMOKE_BOOTSTRAP: "1"
        run: ./deploy/selfhost/scripts/smoke-test.sh
      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/selfhost
        run: docker compose logs --no-color --tail=200

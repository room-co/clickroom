# Static SPA server for the apps/web and apps/admin images (nginx-unprivileged, port 8080).
# TLS, compression of dynamic routes and API/capture routing live in the Caddy in front
# (deploy/selfhost/Caddyfile); this only serves the built bundle.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Rendered at container start by 40-clickroom-config.sh (envsubst of config.js.template).
  # Never cached: it is how a re-configured container takes effect without a rebuild.
  location = /config.js {
    alias /tmp/clickroom-config/config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
  }

  # Vite emits content-hashed filenames under /assets.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback (react-router, library mode).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
